<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD - Bảo trì</title>
    <style>
        /* Mặc định ẩn thông báo bảo trì */
        #maintenance-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: #0f0f12;
            z-index: 99999;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        /* Khi body có class maintenance-mode, ẩn nội dung web và hiện thông báo */
        body.maintenance-mode > *:not(#maintenance-overlay) {
            display: none !important;
        }
        body.maintenance-mode #maintenance-overlay {
            display: flex !important;
        }

        .maint-box { border: 1px solid #333; padding: 40px; border-radius: 15px; background: rgba(30,30,30,0.5); }
    </style>
    </head>
<body>

    <div id="maintenance-overlay">
        <div class="maint-box">
            <h1 style="color: #ff5f56; font-size: 2rem;">HỆ THỐNG ĐANG BẢO TRÌ</h1>
            <p style="color: #ccc; margin: 15px 0;">Trang web hiện đang tạm thời đóng.</p>
            <a href="https://t.me/obi74z" style="color: #3b82f6; text-decoration: none; font-weight: bold;">[+] Liên hệ hỗ trợ qua Telegram</a>
        </div>
    </div>

    <div id="loader-wrapper">
        </div>
    
    <script>
        // Để đóng web nhanh bằng console:
        // document.body.classList.add('maintenance-mode');
        
        // Để mở lại:
        // document.body.classList.remove('maintenance-mode');
    </script>
</body>
</html>
