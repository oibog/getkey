<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&family=JetBrains+Mono:wght@400&display=swap');

        body {
            margin: 0; font-family: 'Inter', sans-serif; color: white;
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; padding: 20px;
            background-color: #0f0f12;
            background-image: linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .window { 
            background: rgba(30, 30, 30, 0.7); backdrop-filter: blur(20px);
            border-radius: 12px; border: 1px solid rgba(255,255,255,0.15);
            width: 340px; margin-bottom: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            overflow: hidden;
        }
        .title-bar { background: rgba(255,255,255,0.05); padding: 10px 12px; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .dot { width: 11px; height: 11px; border-radius: 50%; }
        .red { background: #ff5f56; } .yellow { background: #ffbd2e; } .green { background: #27c93f; }

        #loader-wrapper {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
            background: #0f0f12; display: flex; flex-direction: column; justify-content: center; align-items: center;
        }
        .terminal { background: #000; padding: 15px; font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #0f0; width: 300px; height: 150px; border: 1px solid #333; margin-bottom: 15px; overflow: hidden;}
        .enter-btn { padding: 10px 30px; background: #3b82f6; border: none; color: white; border-radius: 8px; cursor: pointer; font-weight: bold; display: none; }

        .btn { 
            display: flex; align-items: center; width: 100%; padding: 12px; margin: 8px 0; 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.2); 
            color: white; border-radius: 8px; cursor: pointer; text-decoration: none; 
            font-size: 13px; font-weight: 600; transition: 0.3s; box-sizing: border-box;
        }
        .btn:hover { background: rgba(59, 130, 246, 0.2); border-color: #3b82f6; }
        
        .section-title { color: #f59e0b; font-size: 11px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; }
        .accordion-header { cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: #f59e0b; font-size: 11px; font-weight: 800; text-transform: uppercase; user-select: none; }
        .content { max-height: 0; overflow: hidden; transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1); opacity: 0; }
        
        /* Fix Telegram Icon */
        .tele-icon { width: 20px; height: 20px; margin-right: 10px; object-fit: contain; }
        
        .highlight { color: #f59e0b; font-weight: bold; }

        .qr-container {
            position: relative; width: 180px; height: 180px; margin: 15px auto;
            padding: 4px; border-radius: 12px; overflow: hidden;
        }
        .qr-container::before {
            content: ''; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%; background: conic-gradient(red, orange, yellow, green, blue, indigo, violet, red);
            animation: rotate 3s linear infinite;
        }
        .qr-inner { position: absolute; inset: 4px; background: #1e1e1e; border-radius: 8px; overflow: hidden; z-index: 1; }
        @keyframes rotate { 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <audio id="bgMusic" loop><source src="https://files.catbox.moe/ju8193.mp3" type="audio/mpeg"></audio>

    <div id="loader-wrapper">
        <div class="window" style="width: 320px;">
            <div class="title-bar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <div class="terminal" id="terminal"><div>[System] Initializing VN MOD...</div></div>
        </div>
        <button class="enter-btn" id="enterBtn" onclick="startExperience()">TRUY CẬP WEB</button>
    </div>

    <div class="container">
        <div class="window">
            <div class="title-bar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <div style="padding: 15px;">
                <div class="section-title">CHỌN MỤC</div>
                <button class="btn" onclick="window.open('https://oibog.github.io/getkey/tipa.html', '_blank')">TIPA VN MOD</button>
                <button class="btn" onclick="window.open('https://oibog.github.io/getkey/proxy.html', '_blank')">PROXY FF</button>
            </div>
        </div>

        <div class="window">
            <div class="title-bar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <div style="padding: 15px;">
                <div class="accordion-header" onclick="toggleContent(this)">Ủng hộ (Donate) <span>▼</span></div>
                <div class="content">
                    <div class="qr-container">
                        <div class="qr-inner">
                            <img src="https://api.vietqr.io/image/970422-0374583885-compact.jpg?accountName=NGO SON LAM" style="width:100%; height:100%; object-fit:cover;">
                        </div>
                    </div>
                    <div style="font-size:13px; line-height: 1.8; padding: 0 15px 15px;">
                        <span class="highlight">[+] Ngân hàng: MB BANK</span><br>
                        <span class="highlight">[+] STK: 0374583885</span><br>
                        <span class="highlight">[+] CTK: NGO SON LAM</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="window">
            <div class="title-bar"><div class="dot red"></div><div class="dot yellow"></div><div class="dot green"></div></div>
            <div style="padding: 15px;">
                <div class="accordion-header" onclick="toggleContent(this)">Telegram <span>▼</span></div>
                <div class="content" style="padding-top: 10px;">
                    <a href="https://t.me/vnmodios" target="_blank" class="btn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> VN MOD
                    </a>
                    <a href="https://t.me/obi74z" target="_blank" class="btn">
                        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> ADMIN
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        function startExperience() {
            const audio = document.getElementById('bgMusic');
            audio.play().catch(() => {});
            document.getElementById('loader-wrapper').style.display = 'none';
        }
        function toggleContent(el) {
            const content = el.nextElementSibling;
            content.style.maxHeight = content.style.maxHeight ? null : content.scrollHeight + "px";
            content.style.opacity = content.style.maxHeight ? "1" : "0";
        }

        const term = document.getElementById('terminal');
        const logs = ["[System] Initializing...", "[Info] Connecting...", "[Success] System operational."];
        let i = 0;
        const interval = setInterval(() => { 
            if(i < logs.length) { term.innerHTML += "<div>"+logs[i]+"</div>"; i++; } 
            else { clearInterval(interval); document.getElementById('enterBtn').style.display = 'block'; }
        }, 600);
    </script>
</body>
</html>
