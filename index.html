<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700;800&display=swap');

        body { 
            margin: 0; 
            background: #0f0f12; 
            font-family: 'Inter', sans-serif; 
            color: white; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
        }

        .container { 
            background: #141418; 
            padding: 40px; 
            border-radius: 30px; 
            text-align: center; 
            border: 1px solid #333; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 320px;
        }

        h2 { margin-bottom: 30px; font-size: 24px; text-transform: uppercase; }

        .btn-select { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            margin: 15px 0; 
            background: #1e1e24; 
            border: 1px solid #333; 
            color: white; 
            border-radius: 15px; 
            cursor: pointer; 
            font-weight: bold; 
            font-size: 16px; 
            transition: 0.3s; 
        }

        .btn-select:hover { 
            background: #3b82f6; 
            transform: scale(1.03); 
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>VUI LÒNG CHỌN MỤC</h2>
        
        <!-- Nút TIPA VN MOD - Chuyển sang link bạn yêu cầu -->
        <button class="btn-select" onclick="window.location.href='https://oibog.github.io/getkey/tipa.html'">
            TIPA VN MOD
        </button>
        
        <!-- Nút PROXY FF - Chuyển sang link của bạn -->
        <button class="btn-select" onclick="window.location.href='https://oibog.github.io/getkey/proxy.html'">
            PROXY FF
        </button>
    </div>

</body>
</html>
