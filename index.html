<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        /* Nền ô kẻ lưới trắng */
        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #0f0f12;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px; /* Kích thước ô lưới */
        }

        .container { 
            width: 340px; 
            background: rgba(0, 0, 0, 0.4); 
            padding: 20px; 
            border-radius: 25px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px); 
            -webkit-backdrop-filter: blur(15px);
        }

        /* Các khối UI */
        .admin-header, .box { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            margin-bottom: 15px; 
            backdrop-filter: blur(10px);
        }
        
        .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 15px; }
        .user-left { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #3b82f6; flex-shrink: 0; }
        .name { font-weight: 800; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .role { color: #ff4d4d; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        .time-right { font-size: 11px; color: #ccc; text-align: right; flex-shrink: 0; margin-left: 10px; }
        
        .section-title { color: #f59e0b; font-size: 12px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; text-align: left; }
        .btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            width: 100%; padding: 14px; margin: 8px 0; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 12px; 
            cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; box-sizing: border-box; 
        }
        .btn:hover { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; transform: scale(1.02); }
        .tele-icon { width: 22px; height: 22px; margin-right: 10px; flex-shrink: 0; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <div class="user-left">
                <img src="https://sf-static.upanhlaylink.com/img/image_2026050401952684c70ab915e7eb78b4b2c90902.jpg" class="avatar">
                <div class="user-details">
                    <div class="name">obi74z</div>
                    <div class="role">ADMIN</div>
                </div>
            </div>
            <div class="time-right">13:37<br>4/6/2026</div>
        </div>

        <div class="box">
            <div class="section-title">Thông báo</div>
            <div style="font-size: 14px; color: #eee; margin: 5px 0;">• Proxy: Đang bảo trì</div>
            <div style="font-size: 14px; color: #eee; margin: 5px 0;">• Tipa: Đã up thêm key 4/6/2026</div>
        </div>

        <div class="box">
            <div class="section-title">Chọn hệ thống</div>
            <button class="btn" onclick="window.location.href='https://oibog.github.io/getkey/tipa.html'">TIPA VN MOD</button>
            <button class="btn" onclick="window.location.href='https://oibog.github.io/getkey/proxy.html'">PROXY FF</button>
        </div>

        <div class="box">
            <div class="section-title">Box Telegram</div>
            <a href="https://t.me/vnmodios" class="btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> VN MOD
            </a>
            <a href="https://t.me/obicheat" class="btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> obi cheat
            </a>
        </div>
    </div>

</body>
</html>
