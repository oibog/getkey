<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body {
            margin: 0;
            font-family: 'Inter', sans-serif;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            background-color: #0f0f12;
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
        }

        .container { width: 340px; }

        .admin-header, .box { 
            background: rgba(255, 255, 255, 0.05); 
            padding: 20px; 
            border-radius: 20px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            margin-bottom: 15px; 
            backdrop-filter: blur(10px);
        }
        
        .admin-header { display: flex; align-items: center; justify-content: space-between; padding: 15px; }
        .user-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #3b82f6; }
        .name { font-weight: 800; font-size: 15px; }
        .role { color: #ff4d4d; font-size: 11px; font-weight: 700; text-transform: uppercase; }
        
        .section-title { color: #f59e0b; font-size: 12px; font-weight: 800; margin-bottom: 12px; text-transform: uppercase; }
        
        /* Accordion Style */
        .accordion-header { 
            cursor: pointer; display: flex; justify-content: space-between; align-items: center;
            color: #f59e0b; font-size: 12px; font-weight: 800; text-transform: uppercase;
        }
        .content { display: none; margin-top: 15px; }
        .content.active { display: block; }
        
        .btn { 
            display: flex; align-items: center; justify-content: start; 
            width: 100%; padding: 14px; margin: 8px 0; background: rgba(255, 255, 255, 0.05); 
            border: 1px solid rgba(255, 255, 255, 0.1); color: white; border-radius: 12px; 
            cursor: pointer; font-weight: bold; transition: 0.3s; text-decoration: none; box-sizing: border-box;
        }
        .btn:hover { background: rgba(59, 130, 246, 0.4); border-color: #3b82f6; }
        .tele-icon { width: 22px; height: 22px; margin-right: 8px; flex-shrink: 0; }

        /* Donate Style */
        .donate-box { text-align: center; }
        .qr-container {
            padding: 3px;
            background: linear-gradient(45deg, #f00, #ff0, #0f0, #0ff, #00f, #f0f, #f00);
            background-size: 400%;
            border-radius: 15px;
            animation: rainbow 5s linear infinite;
            display: inline-block;
            margin-bottom: 15px;
        }
        .qr-container img { display: block; border-radius: 12px; width: 150px; height: 150px; }
        @keyframes rainbow { 0% { background-position: 0 0; } 100% { background-position: 400% 0; } }
        .bank-info { font-size: 13px; color: #fff; text-align: left; padding-left: 5px; }
        .bank-row { margin-bottom: 8px; }
    </style>
</head>
<body>

    <div class="container">
        <div class="admin-header">
            <div class="user-left">
                <img src="https://sf-static.upanhlaylink.com/img/image_2026050401952684c70ab915e7eb78b4b2c90902.jpg" class="avatar">
                <div>
                    <div class="name">obi74z</div>
                    <div class="role">ADMIN</div>
                </div>
            </div>
            <div style="font-size: 11px; text-align: right;">11:41<br>5/6/2026</div>
        </div>

        <div class="box">
            <div class="section-title">Thông báo</div>
            <div style="font-size: 14px; color: #eee; margin: 5px 0;">[+] Proxy: Đã up thêm key 5/6/2026</div>
            <div style="font-size: 14px; color: #eee; margin: 5px 0;">[+] Tipa: Đã up thêm key 5/6/2026</div>
        </div>

        <div class="box">
            <div class="section-title">CHỌN HỆ THỐNG</div>
            <button class="btn" onclick="window.location.href='https://oibog.github.io/getkey/tipa.html'">TIPA VN MOD</button>
            <button class="btn" onclick="window.location.href='https://oibog.github.io/getkey/proxy.html'">PROXY FF</button>
        </div>

        <div class="box">
            <div class="accordion-header" onclick="toggle(this)">Ủng hộ (Donate) <span>▼</span></div>
            <div class="content donate-box">
                <div class="qr-container" style="margin-top: 15px;">
                    <img src="https://api.vietqr.io/image/970422-0374583885-compact.jpg?accountName=NGO SON LAM" alt="QR">
                </div>
                <div class="bank-info">
                    <div class="bank-row">Ngân hàng: <b>MB BANK</b></div>
                    <div class="bank-row">Chủ tài khoản: <b>NGO SON LAM</b></div>
                    <div class="bank-row">Số tài khoản: <b>0374583885</b></div>
                </div>
            </div>
        </div>

        <div class="box">
            <div class="accordion-header" onclick="toggle(this)">Telegram <span>▼</span></div>
            <div class="content">
                <a href="https://t.me/vnmodios" class="btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> VN MOD
                </a>
                <a href="https://t.me/obi74z" class="btn">
                    <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" class="tele-icon"> ADMIN
                </a>
            </div>
        </div>
    </div>

    <script>
        function toggle(el) {
            const content = el.nextElementSibling;
            content.classList.toggle('active');
        }
    </script>
</body>
</html>
