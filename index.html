<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');

        body { margin: 0; background: #0f0f12; font-family: 'Inter', sans-serif; color: white; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }

        .container { width: 340px; }

        /* Khung Admin */
        .admin-header { background: #1a1a21; padding: 15px; border-radius: 15px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 20px; border: 1px solid #333; }
        .user-left { display: flex; align-items: center; gap: 12px; }
        .avatar { width: 45px; height: 45px; border-radius: 50%; border: 2px solid #3b82f6; }
        
        /* Tên và Role */
        .user-details { display: flex; flex-direction: column; }
        .name { font-weight: 800; font-size: 15px; }
        .role { color: #ff4d4d; font-size: 11px; font-weight: 700; text-transform: uppercase; margin-top: 2px; }
        
        .time-right { font-size: 11px; color: #888; text-align: right; }

        /* Các khối khác */
        .notice-box { background: #141418; padding: 20px; border-radius: 20px; border: 1px solid #333; margin-bottom: 20px; text-align: left; }
        .section-title { color: #f59e0b; font-size: 12px; font-weight: 800; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 1px; }
        .notice-text { font-size: 14px; margin: 5px 0; color: #ddd; }

        .select-box { background: #141418; padding: 20px; border-radius: 20px; border: 1px solid #333; text-align: center; }
        .btn-select { display: block; width: 100%; padding: 15px; margin: 10px 0; background: #1e1e24; border: 1px solid #444; color: white; border-radius: 12px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-select:hover { background: #3b82f6; border-color: #3b82f6; transform: scale(1.02); }
    </style>
</head>
<body>

    <div class="container">
        <!-- Khung Admin -->
        <div class="admin-header">
            <div class="user-left">
                <img src="https://sf-static.upanhlaylink.com/img/image_20260514f529ade08e35385420e427b95f7c5367.jpg" class="avatar">
                <div class="user-details">
                    <div class="name">obi74z</div>
                    <div class="role">ADMIN</div>
                </div>
            </div>
            <div class="time-right">11:12<br>4/6/2026</div>
        </div>

        <!-- Khung thông báo -->
        <div class="notice-box">
            <div class="section-title">Thông báo</div>
            <div class="notice-text">[+] Proxy: Hiện đang bảo trì</div>
            <div class="notice-text">[+] Tipa: Ổn định - ad mới up thêm key free 4/6/2026</div>
        </div>



<!-- Khung chọn mục -->
        <div class="select-box">
            <div class="section-title">Chọn Mục</div>
            <button class="btn-select" onclick="window.location.href='https://oibog.github.io/getkey/tipa.html'">TIPA VN MOD</button>
            <button class="btn-select" onclick="window.location.href='https://oibog.github.io/getkey/proxy.html'">PROXY FF</button>
        </div>
    </div>

</body>
</html>
