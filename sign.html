<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VN MOD | SIGNER</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono&display=swap');

        * { box-sizing: border-box; }

        body {
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            color: white;
            background-color: #0f0f12;
            /* Nền ô kẻ lưới */
            background-image: 
                linear-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            min-height: 100vh; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            padding: 15px;
        }

        .window { 
            background: rgba(25, 25, 30, 0.9); 
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 16px;
            width: 100%; 
            max-width: 400px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .title-bar { 
            background: rgba(255,255,255,0.03); 
            padding: 14px 20px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            align-items: center; 
            gap: 8px;
        }
        .dot { width: 10px; height: 10px; border-radius: 50%; }

        .content { padding: 20px; }

        .input-group { margin-bottom: 15px; width: 100%; }
        
        .flex-box { display: flex; gap: 8px; align-items: center; }
        
        input[type="text"], input[type="password"] { 
            width: 100%; padding: 12px 15px; background: rgba(0,0,0,0.4); 
            border: 1px solid rgba(255,255,255,0.1); border-radius: 10px;
            color: #fff; font-family: 'JetBrains Mono'; font-size: 13px;
        }
        input:focus { border-color: #3b82f6; outline: none; background: rgba(0,0,0,0.6); }

        .btn-select { 
            background: rgba(59, 130, 246, 0.1); border: 1px solid #3b82f6; 
            color: #3b82f6; padding: 0 15px; height: 42px; border-radius: 10px; 
            cursor: pointer; font-weight: 600; font-size: 12px; transition: 0.3s;
        }
        .btn-select:hover { background: #3b82f6; color: white; }

        .sign-btn { 
            width: 100%; padding: 15px; background: #3b82f6; border: none; 
            border-radius: 10px; color: white; font-weight: 800; cursor: pointer; 
            text-transform: uppercase; margin-top: 10px; transition: 0.3s;
        }
        .sign-btn:hover { background: #2563eb; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3); }
        .sign-btn:disabled { background: #444; cursor: not-allowed; }

        .checkbox-row { font-size: 13px; margin: 10px 0; color: #aaa; display: flex; align-items: center; gap: 10px; }
        .file-input-hidden { display: none; }
    </style>
</head>
<body>

<div class="window">
    <div class="title-bar">
        <div class="dot" style="background:#ff5f56"></div>
        <div class="dot" style="background:#ffbd2e"></div>
        <div class="dot" style="background:#27c93f"></div>
    </div>
    
    <div class="content">
        <input type="file" id="ipaFile" class="file-input-hidden" accept=".ipa">
        <input type="file" id="p12File" class="file-input-hidden" accept=".p12">
        <input type="file" id="provFile" class="file-input-hidden" accept=".mobileprovision">

        <div class="input-group flex-box">
            <input type="text" id="ipaName" placeholder="Chọn file .ipa" readonly>
            <button class="btn-select" onclick="document.getElementById('ipaFile').click()">Chọn</button>
        </div>

        <div class="input-group flex-box">
            <input type="text" id="p12Name" placeholder="Chọn file .p12" readonly>
            <button class="btn-select" onclick="document.getElementById('p12File').click()">Chọn</button>
        </div>

        <div class="input-group">
            <input type="password" id="p12Pass" placeholder="Mật khẩu .p12">
        </div>

        <div class="input-group flex-box">
            <input type="text" id="provName" placeholder="Chọn file .mobileprovision" readonly>
            <button class="btn-select" onclick="document.getElementById('provFile').click()">Chọn</button>
        </div>

        <div class="checkbox-row">
            <input type="checkbox" id="delProv"> Xóa embedded.mobileprovision
        </div>

        <div class="input-group">
            <input type="text" placeholder="Bundle ID mới (không bắt buộc)">
        </div>
        <div class="input-group">
            <input type="text" placeholder="Bundle Name mới (không bắt buộc)">
        </div>

        <button class="sign-btn" id="signBtn">KÝ ỨNG DỤNG (SIGN)</button>
    </div>
</div>

<script>
    // Xử lý hiển thị tên file khi chọn
    function setup(id, display) {
        document.getElementById(id).addEventListener('change', e => {
            document.getElementById(display).value = e.target.files[0]?.name || "";
        });
    }
    setup('ipaFile', 'ipaName');
    setup('p12File', 'p12Name');
    setup('provFile', 'provName');

    // Xử lý sự kiện nhấn nút ký
    document.getElementById('signBtn').addEventListener('click', function() {
        const ipa = document.getElementById('ipaFile').files[0];
        const p12 = document.getElementById('p12File').files[0];
        const prov = document.getElementById('provFile').files[0];

        if (!ipa || !p12 || !prov) {
            alert("⚠️ Vui lòng chọn đầy đủ các file cần thiết!");
            return;
        }

        const btn = this;
        btn.innerText = "ĐANG XỬ LÝ...";
        btn.disabled = true;

        // Giả lập quá trình ký (bạn sẽ thay thế logic này bằng fetch API tới server của bạn sau này)
        setTimeout(() => {
            alert("✅ Ký thành công: " + ipa.name);
            btn.innerText = "KÝ ỨNG DỤNG (SIGN)";
            btn.disabled = false;
        }, 2000);
    });
</script>

</body>
</html>
